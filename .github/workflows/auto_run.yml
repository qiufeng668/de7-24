name: Auto Run Devpn Node Scraper

on:
  schedule:
    # 每 6 天的 UTC 时间 00:00 自动运行一次（北京/新加坡时间 08:00）
    - cron: '0 0 */6 * *'
  workflow_dispatch: # 允许在 GitHub 网页端手动点击触发运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限，以便推送生成的 txt 和 json 文件

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python Script
        run: python devpn.py

      - name: Commit and Push Outputs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nodes.txt last_account.json
          # 如果文件有更新则提交，没有更新则跳过以免报错
          git commit -m "Auto-update VPN nodes" || exit 0
          git push
